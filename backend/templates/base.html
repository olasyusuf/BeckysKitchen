<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meal Order Management</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Main Navigation">
        <a href="{{ url_for('index') }}" class="nav-brand">
          MealOrder <span>Portal</span>
        </a>

        <div class="nav-links">
          {% if session.get('user_id') %}
            <span class="nav-user">
              Hello, <strong>{{ session.get('username') }}</strong>
            </span>
            <a href="{{ url_for('logout') }}" class="btn-logout">
              Logout
            </a>
          {% endif %}
        </div>
      </nav>
    </header>
    {% block content %} {% endblock %}

    <footer class="site-footer">
      <p>&copy; 2026 MealOrder Portal. All rights reserved.</p>
    </footer>

    <!-- Hook for Page-Specific Scripts -->
    {% block extra_js %}{% endblock %}
  </body>
</html>
